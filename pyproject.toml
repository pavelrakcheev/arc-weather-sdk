[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-weather-sdk"
dynamic = ["version"]
description = "Python SDK for the Arc Weather API: forecasts, observations and planetary data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pavel Rakcheev" }]
keywords = ["weather", "forecast", "sdk", "api", "async", "httpx", "client"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.28,<1"]

[project.urls]
Homepage = "https://github.com/pavelrakcheev/arc-weather-sdk"
Repository = "https://github.com/pavelrakcheev/arc-weather-sdk"
Issues = "https://github.com/pavelrakcheev/arc-weather-sdk/issues"
Changelog = "https://github.com/pavelrakcheev/arc-weather-sdk/blob/main/CHANGELOG.md"

[project.scripts]
arc-weather = "arc_weather_sdk.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "arc_weather_sdk._version.__version__" }

[tool.setuptools.packages.find]
include = ["arc_weather_sdk*"]

[tool.setuptools.package-data]
arc_weather_sdk = ["py.typed"]
